   <g id="text_3">
    <text style="fill: #2463b7; font: 700 21px 'Times New Roman'; text-anchor: start" x="59.76" y="154.305937" transform="rotate(-0 59.76 154.305937)">01</text>
   </g>
   <g id="text_4">
    <text style="fill: #172b40; font: 700 15.8px 'Arial'; text-anchor: start" x="59.76" y="193.661906" transform="rotate(-0 59.76 193.661906)">Choose a target</text>
   </g>
   <g id="text_5">
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(59.76 226.612406)">SSH config aliases</text>
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(59.76 243.694462)">WSL distributions</text>
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(59.76 260.887162)">Or add a host manually</text>
   </g>
   <g id="text_6">
    <text style="fill: #2463b7; font: 700 21px 'Times New Roman'; text-anchor: start" x="331.92" y="154.305937" transform="rotate(-0 331.92 154.305937)">02</text>
   </g>
   <g id="text_7">
    <text style="fill: #172b40; font: 700 15.8px 'Arial'; text-anchor: start" x="331.92" y="193.469344" transform="rotate(-0 331.92 193.469344)">Check the environment</text>
   </g>
   <g id="text_8">
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(331.92 226.458844)">Probe Node + dsh</text>
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(331.92 243.393244)">Review missing components</text>
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(331.92 260.4753)">Install without sudo</text>
   </g>
   <g id="text_9">
    <text style="fill: #2463b7; font: 700 21px 'Times New Roman'; text-anchor: start" x="604.08" y="154.305937" transform="rotate(-0 604.08 154.305937)">03</text>
   </g>
   <g id="text_10">
    <text style="fill: #172b40; font: 700 15.8px 'Arial'; text-anchor: start" x="604.08" y="193.661906" transform="rotate(-0 604.08 193.661906)">Port model config</text>
   </g>
   <g id="text_11">
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(604.08 226.612406)">Select providers &amp; key refs</text>
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(604.08 243.694462)">Preview names and counts</text>
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(604.08 260.874563)">Back up remote files</text>
   </g>
   <g id="text_12">
    <text style="fill: #2463b7; font: 700 21px 'Times New Roman'; text-anchor: start" x="876.24" y="154.305937" transform="rotate(-0 876.24 154.305937)">04</text>
   </g>
   <g id="text_13">
    <text style="fill: #172b40; font: 700 15.8px 'Arial'; text-anchor: start" x="876.24" y="193.469344" transform="rotate(-0 876.24 193.469344)">Connect &amp; work</text>
   </g>
   <g id="text_14">
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(876.24 226.458844)">Full remote DSH interface</text>
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(876.24 243.393244)">HTTP + WebSocket UI</text>
    <text style="fill: #54677a; font: 12.6px 'Arial'" transform="translate(876.24 260.327644)">Reload, restart or stop</text>
   </g>
   <g id="text_15">
    <text style="fill: #54677a; font: 12.5px 'Arial'; text-anchor: start" x="43.2" y="347.499609" transform="rotate(-0 43.2 347.499609)">Already installed or configured? Continue with the steps you need.</text>
   </g>
   <g id="text_16">
    <text style="fill: #14776c; font: 700 14px 'Arial'; text-anchor: start" x="61.92" y="399.711562" transform="rotate(-0 61.92 399.711562)">Close the panel → reconnect later</text>
   </g>
   <g id="text_17">
    <text style="fill: #14776c; font: 11.7px 'Arial'; text-anchor: start" x="61.92" y="424.534641" transform="rotate(-0 61.92 424.534641)">The remote process keeps running when the local connection closes.</text>
   </g>
   <g id="text_18">
    <text style="fill: #172b40; font: 700 14px 'Arial'; text-anchor: start" x="596.16" y="399.711562" transform="rotate(-0 596.16 399.711562)">Stop remote → end the remote process</text>
   </g>
   <g id="text_19">
    <text style="fill: #54677a; font: 11.7px 'Arial'; text-anchor: start" x="596.16" y="424.534641" transform="rotate(-0 596.16 424.534641)">Use the toolbar when you want to shut the workspace down.</text>
